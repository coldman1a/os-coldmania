# recipe.yml
name: coldmania
description: Custom Arch-based minimalist desktop OS
base-image: ghcr.io/ublue-os/base-main # or your preferred base image
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr

  - type: rpm-ostree # or pacman/custom scripts depending on base architecture
    install:
      - fastfetch
      - git
      - curl

  - type: default-flatpaks
    notify: true
    system:
      install:
        - org.mozilla.firefox
